[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-lyr"
version = "0.1.0"
description = "Instagram MCP server using browser cookies and httpx"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.1.1",
    "inquirer>=3.4.0",
    "obscura-core @ git+https://github.com/ishan-parihar/obscura-core.git",
    "Pillow>=10.0.0",
    "instagrapi>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
instagram-lyr = "instagram_mcp_server.cli_wrapper:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["instagram_mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]